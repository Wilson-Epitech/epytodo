name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and check
        working-directory: my_app
        run: |
          npm install
          for f in $(find src -name '*.js'); do node --check "$f"; done
